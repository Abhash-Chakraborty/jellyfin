name: Publish GHCR Image

on:
  push:
    branches:
      - Abhash-Main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_VERSION: "10.0.x"

jobs:
  test-and-publish:
    name: Test and publish Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Test
        run: dotnet test Jellyfin.sln --configuration Release --verbosity minimal

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: jellyfin-web/package-lock.json

      - name: Test web client
        working-directory: jellyfin-web
        run: |
          npm ci
          npm run build:check
          npm test

      - name: Compute image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          echo "full=ghcr.io/${owner}/${repo}-abhash" >> "$GITHUB_OUTPUT"
          echo "server=ghcr.io/${owner}/${repo}-abhash-server" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.full }}:latest
            ${{ steps.image.outputs.full }}:abhash-main
            ${{ steps.image.outputs.full }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push server-only image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.server }}:latest
            ${{ steps.image.outputs.server }}:abhash-main
            ${{ steps.image.outputs.server }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
